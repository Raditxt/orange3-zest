name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # OWPCA butuh Qt; runner tidak punya layar.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Versi disamakan dengan Python bawaan Orange 3.40.0 di mesin perekaman bukti GUI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.1.3 scikit-learn==1.5.2 Orange3==3.40.0 \
            PyQt5==5.15.11 PyQtWebEngine==5.15.7 pytest==9.2.0
          pip install -e . --no-deps

      # bank-full tidak ada di repo, jadi test bank di-skip (-rs menampilkan alasannya).
      - name: Run tests
        run: pytest tests -q -rs -p no:warnings
